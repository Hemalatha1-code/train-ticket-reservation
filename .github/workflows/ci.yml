
name: ci pipe line

on:
  push:
    branches:
      - master


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn clean install
      - name: Run compile
        run: mvn compile
      
      - name: Run Unit Tests
        run: mvn test

      - name: Run package
        run: mvn package